name: build-exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pydirectinput keyboard

      - name: Build single-file exe
        run: pyinstaller --noconfirm --clean --onefile --noconsole --name WaveRunner waverunner.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveRunner-exe
          path: dist/WaveRunner.exe
          if-no-files-found: error

      - name: Publish to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title WaveRunner --notes 'Automated Windows build of the current main branch.'
          }
          gh release upload $env:TAG dist/WaveRunner.exe --clobber
